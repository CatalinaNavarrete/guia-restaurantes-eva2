<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Nuevo Restaurante</title>
</head>

<body>

    <h1>Registrar Restaurante</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Guardar Restaurante
        </button>
    </form>

    <br>

    <a href="{% url 'listar_restaurantes' %}">
        Volver al listado
    </a>

</body>

</html>
