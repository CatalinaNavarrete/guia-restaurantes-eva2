<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar restaurante</title>
</head>
<body>
    <h1>Editar restaurante: {{ restaurante.nombre }}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Guardar cambios</button>
        <a href="{% url 'listar_restaurantes' %}">Cancelar</a>
    </form>
</body>
</html>
