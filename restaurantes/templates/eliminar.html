<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar restaurante</title>
</head>
<body>
    <h1>Eliminar restaurante</h1>
    <p>¿Seguro que deseas eliminar "{{ restaurante.nombre }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
        <a href="{% url 'listar_restaurantes' %}">Cancelar</a>
    </form>
</body>
</html>
