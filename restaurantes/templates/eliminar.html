<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar restaurante</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 32px 20px;
            overflow-wrap: anywhere;
        }

        button,
        a {
            display: inline-block;
            padding: 12px 16px;
            margin-bottom: 8px;
            font-size: 16px;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }

            h1 {
                font-size: 24px;
            }

            button,
            a {
                display: block;
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <h1>Eliminar restaurante</h1>
    <p>¿Seguro que deseas eliminar "{{ restaurante.nombre }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
        <a href="{% url 'listar_restaurantes' %}">Cancelar</a>
    </form>
</body>
</html>
