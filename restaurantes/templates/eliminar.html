<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar restaurante</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
        }

        .contenedor {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background-color: white;
            width: 100%;
            max-width: 500px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.10);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #222;
        }

        .advertencia {
            color: #666;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .nombre-restaurante {
            font-weight: bold;
            color: #222;
        }

        .btn-eliminar {
            width: 100%;
            background-color: #b23a48;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-eliminar:hover {
            background-color: #8f2f3a;
        }

        .volver {
            display: block;
            margin-top: 20px;
            color: #2f5d8a;
            text-decoration: none;
            font-weight: bold;
        }

        .volver:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .card {
                padding: 25px 20px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <div class="card">

            <h1>Eliminar restaurante</h1>

            <p class="advertencia">
                ¿Estás seguro de que deseas eliminar
                <span class="nombre-restaurante">
                    {{ restaurante.nombre }}
                </span>?
            </p>

            <p class="advertencia">
                Esta acción no se puede deshacer.
            </p>

            <form method="POST">
                {% csrf_token %}

                <button type="submit" class="btn-eliminar">
                    Sí, eliminar restaurante
                </button>
            </form>

            <a href="{% url 'listar_restaurantes' %}" class="volver">
                Cancelar y volver
            </a>

        </div>

    </div>

</body>
</html>
