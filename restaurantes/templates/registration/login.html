<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 450px;
            margin: 0 auto;
            padding: 32px 20px;
            overflow-wrap: anywhere;
        }

        label {
            display: block;
            margin-bottom: 6px;
        }

        input:not([type="hidden"]) {
            width: 100%;
            min-height: 44px;
            padding: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            min-height: 44px;
            padding: 12px 16px;
            font-size: 16px;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <h2>Iniciar sesión</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Entrar</button>
    </form>
</body>
</html>
