<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar restaurante</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
        }

        .contenedor {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background-color: white;
            width: 100%;
            max-width: 520px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.10);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
            text-align: center;
            color: #222;
            overflow-wrap: anywhere;
        }

        .subtexto {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 15px;
        }

        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input:not([type="hidden"]),
        select,
        textarea {
            width: 100%;
            min-height: 44px;
            padding: 12px;
            border: 1px solid #cfcfcf;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #4b6584;
            box-shadow: 0 0 0 2px rgba(75, 101, 132, 0.15);
        }

        .errorlist {
            color: #b00020;
            margin: 8px 0;
            padding-left: 20px;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .mensaje {
            padding: 12px;
            margin-bottom: 16px;
            border-radius: 8px;
            background-color: #e8eef4;
            overflow-wrap: anywhere;
        }

        .mensaje.success {
            background-color: #d4f7dc;
        }

        .mensaje.error {
            background-color: #f9d6d6;
        }

        .btn-principal {
            width: 100%;
            min-height: 44px;
            background-color: #2f3e46;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-principal:hover {
            background-color: #1f2a30;
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            color: #2f5d8a;
            text-decoration: none;
            font-weight: bold;
        }

        .volver:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .card {
                padding: 25px 20px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="card">
            <h1>Reservar en {{ restaurante.nombre }}</h1>

            <p class="subtexto">
                Capacidad del restaurante:
                <strong>{{ restaurante.capacidad }} personas</strong>.
                Los cupos disponibles se validan según la fecha y hora.
            </p>

            {% for message in messages %}
                <div class="mensaje {{ message.tags }}" role="status">
                    {{ message }}
                </div>
            {% endfor %}

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit" class="btn-principal">
                    Confirmar reserva
                </button>
            </form>

            <a href="{% url 'listar_restaurantes' %}" class="volver">
                Volver al listado
            </a>
        </div>
    </div>
</body>
</html>
